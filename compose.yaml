services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: threats
      POSTGRES_USER: threat_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD-dev-owner-change-me}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD-dev-app-change-me}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./deploy/postgres/10-app-role.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U threat_owner -d threats"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  migrate:
    build: .
    image: threatservice:local
    entrypoint: ["/app/migrate"]
    command: ["-app-role=threat_app", "up"]
    environment:
      DATABASE_URL: postgres://threat_owner@postgres:5432/threats?sslmode=disable
      PGPASSWORD: ${POSTGRES_PASSWORD-dev-owner-change-me}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    image: threatservice:local
    build: .
    environment:
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://threat_app@postgres:5432/threats?sslmode=disable
      PGPASSWORD: ${APP_DB_PASSWORD-dev-app-change-me}
      PG_MAX_CONNS: ${PG_MAX_CONNS:-10}
      REQUEST_TIMEOUT: ${REQUEST_TIMEOUT:-3s}
      QUERY_TIMEOUT: ${QUERY_TIMEOUT:-2s}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-10s}
      API_TOKEN: ${API_TOKEN:-}
      RATE_LIMIT_RPS: ${RATE_LIMIT_RPS:-0}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-20}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 15s
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  pgdata:
